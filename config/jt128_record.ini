# JT128 network recording config
# Adjust device_ip_address to match your lidar's IP

[source_type]
source_type = network

[network]
device_ip_address = 192.168.1.201
ptc_port = 9347
udp_port = 2368
multicast_ip_address =
use_ptc_connected = true
correction_file_path =
firetimes_path =
host_ip_address =
fault_message_port = 0
ptc_mode = tcp
certFile =
privateKeyFile =
caFile =

[decoder]
pcap_play_synchronization = true
socket_buffer_size = 262144000
